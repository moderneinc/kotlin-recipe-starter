# Declarative YAML recipes work on Kotlin too: the Kotlin LST extends the Java LST,
# so type-based recipes such as `org.openrewrite.java.ChangeType` rewrite Kotlin
# sources the same way they rewrite Java. Compose recipes here, or in the builder at
# https://app.moderne.io/recipes/builder
---
type: specs.openrewrite.org/v1beta/recipe
name: com.yourorg.UseJSpecifyNullable
displayName: Use JSpecify `@Nullable`
description: Replaces the JetBrains `@Nullable` annotation with the JSpecify equivalent, in Java and Kotlin alike.
recipeList:
  - org.openrewrite.java.ChangeType:
      oldFullyQualifiedTypeName: org.jetbrains.annotations.Nullable
      newFullyQualifiedTypeName: org.jspecify.annotations.Nullable
