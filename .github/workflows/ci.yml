---
name: ci

on:
  push:
    branches:
      - main
    tags-ignore:
      - "*"
  pull_request:
    branches:
      - main
  workflow_dispatch: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  GRADLE_OPTS: '-Dorg.gradle.jvmargs="-Xmx2048m -XX:+HeapDumpOnOutOfMemoryError"'
  GRADLE_SWITCHES: '--console=plain --info --stacktrace'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6
      - name: build
        run: ./gradlew ${{ env.GRADLE_SWITCHES }} build test
        env:
          # Lets both settings.gradle.kts (org.openrewrite.build.* plugins) and
          # org.openrewrite.build.recipe-repositories (org.openrewrite and io.moderne dependencies)
          # resolve from the Code Genome Project, which is where they are published. Empty for
          # forks and for clones of this template that have not set the secrets, which leaves the
          # repository undeclared and resolution limited to Maven Central and the Gradle Plugin
          # Portal.
          ORG_GRADLE_PROJECT_codegenomeUsername: ${{ secrets.CODEGENOME_USERNAME }}
          ORG_GRADLE_PROJECT_codegenomePassword: ${{ secrets.CODEGENOME_TOKEN }}
